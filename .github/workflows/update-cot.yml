name: Update COT Data

on:
  schedule:
    # كل يوم جمعة الساعة 21:00 UTC (بعد نشر تقرير CFTC بـ 3:30 عصراً توقيت شرق أمريكا تقريباً)
    - cron: '0 21 * * 5'
  workflow_dispatch: {}  # يسمح بتشغيله يدوياً من تبويب Actions بأي وقت

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch COT data
        run: python3 fetch_cot.py

      - name: Commit and push if changed
        run: |
          git config user.name "cot-bot"
          git config user.email "cot-bot@users.noreply.github.com"
          git add cot.json
          git diff --staged --quiet || git commit -m "Update COT data"
          git push
